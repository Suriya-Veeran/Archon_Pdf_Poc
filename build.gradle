plugins {
    id 'java'
}

group = 'com.filecheck'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "com.itextpdf:itext7-core:7.1.18"
    implementation "com.itextpdf:kernel:7.1.18"
    implementation "com.itextpdf:io:7.1.18"

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.11'
    implementation 'org.slf4j:slf4j-api:1.7.32'

    implementation 'org.modelmapper:modelmapper:2.3.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-guava:2.1.2'


    implementation group: 'com.image-charts', name: 'image-charts', version: '6.0.55'

    // https://mvnrepository.com/artifact/org.yaml/snakeyaml
    implementation group: 'org.yaml', name: 'snakeyaml', version: '2.3'


}

test {
    useJUnitPlatform()
}